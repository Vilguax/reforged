name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a (re)publier, ex. v0.2.0'
        required: true
      platforms:
        description: 'Plateformes a publier'
        type: choice
        options: [ both, modrinth, curseforge ]
        default: both

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: echo "ref=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # La GitHub Release n'est creee que sur push de tag (pas en re-publication manuelle).
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # Publication CurseForge + Modrinth en deux etapes independantes : si l'une
      # echoue (ex. 401 token Modrinth, ou fichier deja present cote CurseForge),
      # l'autre n'est pas bloquee.
      # Repository secrets: CURSEFORGE_TOKEN (token d'upload auteur), MODRINTH_TOKEN (PAT
      #   avec les scopes Create/Read/Write versions + Read/Write projects).
      # Repository variables: CURSEFORGE_ID (id projet), MODRINTH_ID (id ou slug).
      # Re-publier une seule plateforme : Actions > Release > Run workflow > choisir le tag
      #   et la plateforme (evite de redéposer un doublon sur l'autre).
      - name: Publish to CurseForge
        if: ${{ (github.event.inputs.platforms || 'both') != 'modrinth' }}
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/!(*-sources|*-dev|*-shadow).jar
          name: Reforged ${{ steps.ref.outputs.ref }}
          version: ${{ steps.ref.outputs.ref }}
          version-type: release
          loaders: fabric
          game-versions: 1.21.4
          java: 21
          dependencies: |
            fabric-api(required)

      - name: Publish to Modrinth
        if: ${{ (github.event.inputs.platforms || 'both') != 'curseforge' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources|*-dev|*-shadow).jar
          name: Reforged ${{ steps.ref.outputs.ref }}
          version: ${{ steps.ref.outputs.ref }}
          version-type: release
          loaders: fabric
          game-versions: 1.21.4
          java: 21
          dependencies: |
            fabric-api(required)
