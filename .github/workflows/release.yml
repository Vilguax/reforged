name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

      # Publication CurseForge + Modrinth.
      # Repository secrets: CURSEFORGE_TOKEN (token d'upload auteur), MODRINTH_TOKEN (PAT).
      # Repository variables: CURSEFORGE_ID (id projet), MODRINTH_ID (id ou slug).
      # mc-publish saute une plateforme dont le token OU l'id est absent : veille a
      # configurer les DEUX entrees Modrinth avant de pousser un tag, sinon 401.
      - name: Publish to CurseForge / Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: build/libs/!(*-sources|*-dev|*-shadow).jar
          name: Reforged ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          loaders: fabric
          game-versions: 1.21.4
          java: 21
          dependencies: |
            fabric-api(required)
